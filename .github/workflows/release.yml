name: Release bundle

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: music-library-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  container:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          provenance: false
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ghcr.io/${{ github.repository }}:latest

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - run: npm install --workspaces --include-workspace-root
      - run: npm run build --workspace @music-library/core
      - name: Set desktop release version
        shell: pwsh
        run: |
          $path = "client/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = "0.1.$env:GITHUB_RUN_NUMBER"
          $config | ConvertTo-Json -Depth 100 | Set-Content $path
      - run: npm run tauri --workspace @music-library/client -- build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install --workspaces --include-workspace-root
      - run: npm run build --workspace @music-library/core
      - name: Set desktop release version
        shell: bash
        run: |
          jq --arg version "0.1.${GITHUB_RUN_NUMBER}" '.version = $version' client/src-tauri/tauri.conf.json > tauri.conf.json
          mv tauri.conf.json client/src-tauri/tauri.conf.json
      - run: npm run tauri --workspace @music-library/client -- build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - run: npm install --workspaces --include-workspace-root
      - run: npm run build --workspace @music-library/core
      - run: npm exec --workspace @music-library/client -- expo prebuild --platform android --non-interactive
      - name: Build APK
        working-directory: client/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon
      - name: Collect APK
        run: cp client/android/app/build/outputs/apk/release/app-release.apk music-library.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: music-library.apk
          if-no-files-found: error

  release:
    needs: [container, desktop-windows, desktop-linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: desktop
          path: release/desktop/windows
      - uses: actions/download-artifact@v5
        with:
          name: desktop-linux
          path: release/desktop/linux
      - uses: actions/download-artifact@v5
        with:
          name: android
          path: release/android
      - name: Assemble release bundle
        shell: bash
        env:
          IMAGE: ${{ needs.container.outputs.image }}
        run: |
          mkdir -p release/container
          cp Dockerfile release/container/Dockerfile
          printf '%s\n%s\n' "$IMAGE" "ghcr.io/${GITHUB_REPOSITORY,,}:latest" > release/container/images.txt
          windows_installer="$(find release/desktop/windows -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          linux_installer="$(find release/desktop/linux -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$windows_installer" && test -f "${windows_installer}.sig"
          test -n "$linux_installer" && test -f "${linux_installer}.sig"
          mv "$windows_installer" release/desktop/music-library-windows.exe
          mv "${windows_installer}.sig" release/desktop/music-library-windows.exe.sig
          mv "$linux_installer" release/desktop/music-library-linux-x86_64.AppImage
          mv "${linux_installer}.sig" release/desktop/music-library-linux-x86_64.AppImage.sig
          windows_signature="$(cat release/desktop/music-library-windows.exe.sig)"
          linux_signature="$(cat release/desktop/music-library-linux-x86_64.AppImage.sig)"
          jq -n \
            --arg version "0.1.${GITHUB_RUN_NUMBER}" \
            --arg notes "Music Library build ${GITHUB_RUN_NUMBER}" \
            --arg pub_date "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_signature "$windows_signature" \
            --arg windows_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/music-library-windows.exe" \
            --arg linux_signature "$linux_signature" \
            --arg linux_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/music-library-linux-x86_64.AppImage" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $windows_signature, url: $windows_url}, "linux-x86_64": {signature: $linux_signature, url: $linux_url}}}' \
            > release/latest.json
          (cd release && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release && zip -r ../music-library-latest.zip .)
      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            music-library-latest.zip
            release/latest.json
            release/desktop/music-library-windows.exe
            release/desktop/music-library-windows.exe.sig
            release/desktop/music-library-linux-x86_64.AppImage
            release/desktop/music-library-linux-x86_64.AppImage.sig
            release/android/music-library.apk
          )
          notes="Release bundle with Windows installer, Ubuntu AppImage, Android APK, GHCR image references, Dockerfile, and checksums."
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest "${assets[@]}" --clobber
            gh release edit latest --title "Music Library Latest" --notes "$notes" --latest
          else
            gh release create latest "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Music Library Latest" \
              --notes "$notes" \
              --latest
          fi
      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current="latest"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' |
            while read -r tag; do
              if [[ "$tag" != "$current" ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              fi
            done
      - name: Keep only the latest container package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_name="${GITHUB_REPOSITORY#*/}"
          versions="$(gh api --paginate --slurp "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions?per_page=100" | jq 'add')"
          latest_id="$(jq -r '[.[] | select(any(.metadata.container.tags[]?; . == "latest"))][0].id // empty' <<< "$versions")"
          test -n "$latest_id"
          jq -r --argjson latest_id "$latest_id" '.[] | select(.id != $latest_id) | .id' <<< "$versions" |
            while read -r version_id; do
              gh api --method DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions/${version_id}"
            done